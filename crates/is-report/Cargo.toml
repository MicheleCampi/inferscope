[package]
name = "is-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Report generation for inferscope: renders metrics as structured text and JSON"

[features]
default = []
# Emit derived metrics as OpenTelemetry spans via OTLP/HTTP.
# Adds opentelemetry, opentelemetry_sdk, opentelemetry-otlp + reqwest as deps.
# See docs/adr/008-opentelemetry-export.md for design rationale (when added).
otel-export = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tokio",
]

[dependencies]
is-core = { path = "../is-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libc.workspace = true

# Optional, enabled by feature otel-export.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
