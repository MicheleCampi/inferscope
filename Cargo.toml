[workspace]
resolver = "2"
members = [
    "crates/is-core",
    "crates/is-probe",
    "crates/is-sysmon",
    "crates/is-metrics",
    "crates/is-report",
    "crates/inferscope",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/MicheleCampi/inferscope"
authors = ["Michele Campi"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "charset", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
nvml-wrapper = "0.12"

# OpenTelemetry stack for the otel-export feature on is-report.
# Coordinated release versions; all three should bump together.
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "hyper-client"] }
